<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>موقعي - مشاريع GitHub</title>
  <style>
    :root {
      --bg: #0f172a;
      --bg2: #111827;
      --card: #1f2937;
      --card2: #374151;
      --text: #f9fafb;
      --muted: #cbd5e1;
      --primary: #8b5cf6;
      --secondary: #22c55e;
      --accent: #f59e0b;
      --shadow: 0 12px 30px rgba(0,0,0,0.25);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Tahoma", sans-serif;
      background: linear-gradient(135deg, var(--bg), var(--bg2));
      color: var(--text);
    }

    .container {
      width: min(1200px, 90%);
      margin: 0 auto;
      padding: 40px 0 80px;
    }

    .hero {
      text-align: center;
      padding: 60px 20px 30px;
    }

    .hero h1 {
      font-size: clamp(2rem, 5vw, 4rem);
      margin: 0 0 15px;
    }

    .hero p {
      color: var(--muted);
      font-size: 1.1rem;
      margin-bottom: 25px;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 30px;
    }

    input, button {
      border: none;
      border-radius: 12px;
      font-size: 1rem;
    }

    input {
      width: min(500px, 80vw);
      padding: 14px 18px;
      background: rgba(255,255,255,0.05);
      color: var(--text);
      outline: none;
      border: 1px solid rgba(255,255,255,0.08);
    }

    button {
      padding: 14px 22px;
      background: linear-gradient(135deg, var(--primary), #7c3aed);
      color: white;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: transform 0.2s ease;
    }

    button:hover { transform: translateY(-1px); }

    .projects {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 22px;
      margin-top: 30px;
    }

    .project-card {
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.04));
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px;
      padding: 22px;
      min-height: 220px;
      box-shadow: var(--shadow);
      transition: transform 0.25s ease, border-color 0.25s ease;
      position: relative;
      overflow: hidden;
    }

    .project-card:hover {
      transform: translateY(-5px);
      border-color: rgba(139, 92, 246, 0.8);
    }

    .project-card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 3px;
      background: linear-gradient(90deg, var(--primary), var(--secondary), var(--accent));
    }

    .project-card h3 {
      margin: 8px 0 10px;
      font-size: 1.4rem;
    }

    .lang {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(34,197,94,0.12);
      color: #7ef0a2;
      font-size: 0.82rem;
      margin-bottom: 12px;
    }

    .desc {
      color: var(--muted);
      line-height: 1.7;
      font-size: 0.96rem;
      min-height: 80px;
    }

    .meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 18px;
      gap: 10px;
      flex-wrap: wrap;
    }

    .stars {
      color: #fbbf24;
      font-weight: bold;
    }

    .links {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .links a {
      text-decoration: none;
      color: white;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 8px 12px;
      transition: 0.2s ease;
    }

    .links a:hover {
      background: rgba(139, 92, 246, 0.2);
    }

    .loading {
      text-align: center;
      color: var(--muted);
      font-size: 1.1rem;
      margin-top: 30px;
    }

    .empty {
      text-align: center;
      color: var(--muted);
      margin-top: 25px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="hero">
      <h1>مشاريعي على GitHub</h1>
      <p>كل المواقع والمشاريع اللي صنعتها متجمعة في صفحة واحدة</p>
    </header>

    <div class="controls">
      <input type="text" id="searchInput" placeholder="ابحث عن مشروع..." />
      <button id="loadBtn">تحديث المشاريع</button>
    </div>

    <div id="projects" class="projects"></div>
    <div id="loading" class="loading">جاري تحميل المشاريع...</div>
    <div id="empty" class="empty">لا يوجد مشروع يطابق البحث.</div>
  </div>

  <script>
    const username = "YOUR_GITHUB_USERNAME"; // مثال: amirx7662-design
    const projectsEl = document.getElementById("projects");
    const loadingEl = document.getElementById("loading");
    const emptyEl = document.getElementById("empty");
    const searchInput = document.getElementById("searchInput");
    const loadBtn = document.getElementById("loadBtn");

    async function loadRepos() {
      loadingEl.style.display = "block";
      projectsEl.innerHTML = "";
      emptyEl.style.display = "none";

      try {
        const res = await fetch(`https://api.github.com/users/${username}/repos?per_page=100`);
        if (!res.ok) throw new Error("فشل في جلب البيانات");

        const repos = await res.json();

        const filtered = repos.filter(repo => !repo.fork); // نزيل fork
        renderRepos(filtered);
      } catch (err) {
        loadingEl.textContent = "حدث خطأ أثناء تحميل المشاريع: " + err.message;
      }
    }

    function renderRepos(repos) {
      loadingEl.style.display = "none";

      if (!repos.length) {
        emptyEl.style.display = "block";
        return;
      }

      repos.forEach(repo => {
        const card = document.createElement("article");
        card.className = "project-card";

        const homepage = repo.homepage && repo.homepage.startsWith("http")
          ? `<a href="${repo.homepage}" target="_blank" rel="noopener">رابط المشروع</a>`
          : "";

        const siteLink = repo.html_url
          ? `<a href="${repo.html_url}" target="_blank" rel="noopener">GitHub</a>`
          : "";

        card.innerHTML = `
          <h3>${repo.name}</h3>
          <span class="lang">${repo.language || "Multi"}</span>
          <div class="desc">${repo.description || "لا يوجد وصف لهذا المشروع بعد."}</div>
          <div class="meta">
            <span class="stars">⭐ ${repo.stargazers_count}</span>
            <div class="links">
              ${homepage}
              ${siteLink}
            </div>
          </div>
        `;

        projectsEl.appendChild(card);
      });
    }

    searchInput.addEventListener("input", () => {
      const term = searchInput.value.trim().toLowerCase();
      const cards = [...document.querySelectorAll(".project-card")];

      cards.forEach(card => {
        const text = card.textContent.toLowerCase();
        const match = text.includes(term);
        card.style.display = match ? "block" : "none";
      });

      const visible = cards.some(card => card.style.display !== "none");
      emptyEl.style.display = visible ? "none" : "block";
    });

    loadBtn.addEventListener("click", loadRepos);

    loadRepos();
  </script>
</body>
</html>
