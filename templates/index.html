<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080b16">
<title>AMIRXTNA | أكاديمية البرمجة</title>

<style>
:root {
  --bg: #080b16;
  --panel: #101629;
  --panel2: #17213a;
  --text: #f2f5ff;
  --muted: #aab4d0;
  --cyan: #38e5ff;
  --purple: #a78bfa;
  --green: #5ef0b2;
  --pink: #ff75bd;
  --border: rgba(151,176,255,.18);
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  background:
    radial-gradient(ellipse at 80% 0%, #29205a55, transparent 35%),
    radial-gradient(ellipse at 0% 30%, #12bede17, transparent 30%),
    var(--bg);
  color: var(--text);
  font-family: Tahoma, Arial, sans-serif;
  line-height: 1.8;
}

button, input { font: inherit; }
button { cursor: pointer; }
a { color: inherit; text-decoration: none; }

.container {
  width: min(1180px, calc(100% - 30px));
  margin: auto;
}

header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: #080b16eF;
  backdrop-filter: blur(15px);
  border-bottom: 1px solid var(--border);
}

.nav {
  min-height: 75px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  flex-wrap: wrap;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 1.15rem;
  font-weight: 900;
  letter-spacing: 1px;
}

.brand-icon {
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  border-radius: 13px;
  background: linear-gradient(135deg, var(--cyan), var(--purple));
  color: #080b16;
}

.nav-links {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.nav-btn, .btn {
  padding: 10px 14px;
  color: var(--text);
  background: #ffffff08;
  border: 1px solid var(--border);
  border-radius: 12px;
  transition: .2s;
}

.nav-btn:hover, .nav-btn.active {
  border-color: var(--cyan);
  background: #38e5ff15;
}

.btn-primary {
  background: linear-gradient(100deg, var(--cyan), #9c9dff);
  color: #07101c;
  font-weight: 900;
  border: none;
}

.btn-primary:hover {
  transform: translateY(-2px);
  filter: brightness(1.08);
}

.btn-secondary:hover {
  border-color: var(--purple);
}

.mobile-menu { display: none; }

.page {
  display: none;
  padding: 35px 0 75px;
  min-height: 70vh;
}

.page.active {
  display: block;
  animation: appear .25s ease;
}

@keyframes appear {
  from { opacity: .35; transform: translateY(5px); }
  to { opacity: 1; transform: none; }
}

.hero {
  padding: 55px 0 35px;
  display: grid;
  grid-template-columns: 1.2fr .8fr;
  align-items: center;
  gap: 35px;
}

.eyebrow {
  color: var(--cyan);
  font-size: .88rem;
  font-weight: 800;
  letter-spacing: 1px;
}

h1, h2, h3 { line-height: 1.4; }

.hero h1 {
  margin: 12px 0;
  font-size: clamp(2.2rem, 5.5vw, 4.2rem);
  line-height: 1.2;
}

.gradient {
  background: linear-gradient(90deg, var(--cyan), #c1a6ff, var(--pink));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.lead {
  color: var(--muted);
  font-size: 1.06rem;
  max-width: 680px;
}

.hero-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 25px;
}

.hero-art {
  position: relative;
  min-height: 300px;
  border: 1px solid var(--border);
  border-radius: 28px;
  display: grid;
  place-items: center;
  background: linear-gradient(145deg, #38e5ff12, #a78bfa12);
  overflow: hidden;
}

.orb {
  width: 180px;
  height: 180px;
  border-radius: 50%;
  border: 2px solid #38e5ff88;
  display: grid;
  place-items: center;
  box-shadow: 0 0 60px #38e5ff22, inset 0 0 40px #a78bfa22;
  position: relative;
}

.orb::before, .orb::after {
  content: "";
  position: absolute;
  inset: -25px;
  border: 1px dashed #a78bfa99;
  border-radius: 50%;
}

.orb::after {
  inset: -48px;
  border-color: #38e5ff55;
}

.orb span {
  color: var(--cyan);
  font-size: 2rem;
  font-weight: 1000;
}

.float-tag {
  position: absolute;
  padding: 7px 12px;
  border: 1px solid var(--border);
  background: var(--panel);
  border-radius: 12px;
  font-size: .8rem;
}

.tag-one { top: 22px; right: 18px; }
.tag-two { bottom: 25px; left: 18px; }
.tag-three { bottom: 32px; right: 18px; }

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin: 15px 0 50px;
}

.stat, .card, .roadmap-item {
  padding: 19px;
  border: 1px solid var(--border);
  background: #101629b8;
  border-radius: 17px;
}

.stat b {
  display: block;
  color: var(--cyan);
  font-size: 1.6rem;
}

.stat span, .muted, .small {
  color: var(--muted);
}

.section-head { margin: 30px 0 18px; }
.section-head h2 { margin: 0; }
.section-head p { color: var(--muted); margin: 5px 0 0; }

.track-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
}

.card {
  background: linear-gradient(155deg, #131c33, #0c111f);
  transition: .2s;
}

.card:hover {
  transform: translateY(-4px);
  border-color: #38e5ff77;
}

.card-icon {
  width: 53px;
  height: 53px;
  display: grid;
  place-items: center;
  font-size: 1.6rem;
  border-radius: 16px;
  background: #38e5ff12;
  border: 1px solid var(--border);
}

.card h3 { margin-bottom: 5px; }
.card p { color: var(--muted); }
.card .btn { margin-top: 10px; }

.progress-track {
  height: 7px;
  background: #26304b;
  border-radius: 50px;
  overflow: hidden;
  margin: 12px 0;
}

.progress-track span {
  height: 100%;
  display: block;
  width: 0;
  background: linear-gradient(90deg, var(--cyan), var(--purple));
}

.roadmap {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin: 22px 0 35px;
}

.roadmap-item b {
  display: block;
  color: var(--purple);
}

.notice {
  padding: 18px;
  border: 1px solid #5ef0b244;
  border-radius: 15px;
  background: #5ef0b20b;
}

.notice strong { color: var(--green); }

.page-title {
  font-size: clamp(1.8rem, 4vw, 2.6rem);
  margin: 5px 0 10px;
}

.course-layout {
  display: grid;
  grid-template-columns: 300px minmax(0, 1fr);
  gap: 17px;
  align-items: start;
}

.lesson-sidebar, .lesson-content {
  border: 1px solid var(--border);
  background: #0d1325e8;
  border-radius: 19px;
  overflow: hidden;
}

.lesson-sidebar {
  position: sticky;
  top: 95px;
}

.sidebar-head {
  padding: 17px;
  border-bottom: 1px solid var(--border);
}

.sidebar-head h3 { margin: 0 0 10px; }

.searchbox {
  width: 100%;
  background: #080d19;
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px;
  outline: none;
}

.searchbox:focus { border-color: var(--cyan); }

.lesson-list {
  padding: 8px;
  max-height: 65vh;
  overflow: auto;
}

.lesson-item {
  display: flex;
  width: 100%;
  text-align: right;
  gap: 10px;
  align-items: flex-start;
  padding: 11px;
  margin-bottom: 4px;
  border: 1px solid transparent;
  border-radius: 11px;
  background: transparent;
  color: var(--text);
}

.lesson-item:hover { background: #ffffff08; }

.lesson-item.active {
  background: #38e5ff10;
  border-color: #38e5ff55;
}

.lesson-item.done .lesson-number {
  background: #5ef0b222;
  color: var(--green);
}

.lesson-number {
  flex: 0 0 30px;
  height: 30px;
  display: grid;
  place-items: center;
  border-radius: 9px;
  background: #1c2641;
}

.lesson-meta strong { display: block; }
.lesson-meta small { color: var(--muted); }

.lesson-content {
  padding: clamp(17px, 3vw, 30px);
  min-height: 500px;
}

.lesson-content h2 { margin: 0; }

.pills {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 15px 0 23px;
}

.pill {
  font-size: .8rem;
  border: 1px solid var(--border);
  padding: 3px 10px;
  border-radius: 50px;
  color: var(--muted);
}

.pill.cyan {
  color: var(--cyan);
  border-color: #38e5ff55;
}

.lesson-section { margin: 24px 0; }
.lesson-section h3 { margin-bottom: 8px; }

.lesson-text {
  color: #d4dcf0;
  white-space: pre-line;
}

.code-wrap { position: relative; }

.code-block {
  direction: ltr;
  text-align: left;
  white-space: pre;
  overflow: auto;
  background: #060a13;
  border: 1px solid #91a9ff22;
  border-radius: 13px;
  padding: 20px;
  color: #9ff5e4;
  font: .9rem/1.7 Consolas, monospace;
}

.copy-btn {
  position: absolute;
  top: 8px;
  left: 8px;
  padding: 5px 10px;
  font-size: .76rem;
  color: var(--text);
  border: 1px solid var(--border);
  background: var(--panel);
  border-radius: 8px;
}

.line-list { padding-right: 22px; color: var(--muted); }
.line-list li { margin-bottom: 7px; }

.task-box {
  padding: 16px;
  border-radius: 14px;
  border: 1px solid #a78bfa55;
  background: #a78bfa0c;
}

.quiz-box {
  padding: 17px;
  border-radius: 15px;
  border: 1px solid var(--border);
  background: #0a1020;
}

.quiz-option {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 11px;
  margin: 9px 0;
  border: 1px solid var(--border);
  border-radius: 11px;
  cursor: pointer;
}

.quiz-option:has(input:checked) {
  border-color: var(--cyan);
  background: #38e5ff0b;
}

.feedback {
  min-height: 30px;
  font-weight: bold;
  margin-top: 10px;
}

.lesson-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  border-top: 1px solid var(--border);
  margin-top: 25px;
  padding-top: 20px;
}

.lesson-footer-nav {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin-top: 15px;
}

.games-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
}

.game-art {
  display: grid;
  place-items: center;
  height: 140px;
  border-radius: 14px;
  border: 1px solid var(--border);
  background: radial-gradient(circle, #38e5ff25, transparent 55%), #15132a;
  font-size: 3rem;
}

.status { color: var(--pink); font-size: .82rem; }

.footer {
  border-top: 1px solid var(--border);
  padding: 28px 0 35px;
  color: var(--muted);
}

.footer-inner {
  display: flex;
  justify-content: space-between;
  gap: 15px;
  flex-wrap: wrap;
}

.ad-slot {
  position: fixed;
  bottom: 14px;
  left: 14px;
  z-index: 20;
  width: 175px;
  min-height: 75px;
  padding: 12px;
  border: 1px
