<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AMIRXTNA</title>
  <style>
    body {
      margin: 0;
      font-family: Tahoma, sans-serif;
      background: #0b1020;
      color: white;
    }
    .container {
      width: min(1000px, 90%);
      margin: 40px auto;
    }
    textarea, button {
      width: 100%;
      border-radius: 12px;
      border: none;
      padding: 16px;
      margin-top: 14px;
      font-size: 16px;
    }
    textarea {
      min-height: 150px;
      background: #121a2b;
      color: white;
      border: 1px solid #2a3654;
    }
    button {
      background: linear-gradient(135deg, #7c3aed, #22c55e);
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    .answer {
      margin-top: 24px;
      padding: 16px;
      background: #111827;
      border: 1px solid #2a3654;
      border-radius: 12px;
      white-space: pre-wrap;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>AMIRXTNA</h1>
    <textarea id="prompt" placeholder="اكتب فكرة أو سؤال..."></textarea>
    <button onclick="sendPrompt()">إرسال</button>

    <div class="answer" id="answer">الرد سيظهر هنا...</div>
  </div>

  <script>
    async function sendPrompt() {
      const prompt = document.getElementById("prompt").value;
      const answerBox = document.getElementById("answer");

      answerBox.textContent = "جاري الإرسال...";

      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt })
      });

      const data = await res.json();

      if (!res.ok) {
        answerBox.textContent = data.error || "حدث خطأ";
        return;
      }

      answerBox.textContent = data.answer;
    }
  </script>
</body>
</html>
