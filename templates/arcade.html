<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMIRXTNA - لعبة الثعبان النيون</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0d1117; color: #fff; text-align: center; padding: 20px; }
        h1 { color: #00f2fe; margin-bottom: 10px; text-shadow: 0 0 10px rgba(0,242,254,0.5); }
        .score-board { font-size: 1.2rem; color: #8b949e; margin-bottom: 15px; }
        #score { color: #00f2fe; font-weight: bold; }
        
        canvas {
            background-color: #161b22;
            border: 2px solid #00f2fe;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,242,254,0.2);
            display: block;
            margin: 0 auto;
        }

        .btn-back {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #21262d;
            color: #00f2fe;
            border: 1px solid #00f2fe;
            border-radius: 8px;
            text-decoration: none;
            transition: 0.3s;
        }
        .btn-back:hover { background-color: #00f2fe; color: #0d1117; }
        .controls-note { color: #8b949e; font-size: 0.85rem; margin-top: 10px; }
    </style>
</head>
<body>

    <h1>🎮 AmirX Arcade - Neon Snake</h1>
    <div class="score-board">النقاط: <span id="score">0</span></div>

    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <p class="controls-note">استخدم أسهم الكيبورد للتحكم بالاتجاهات ⬆️ ⬇️ ⬅️ ➡️</p>

    <a href="/" class="btn-back">⬅️ العودة للرئيسية</a>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const grid = 20;
        let count = 0;
        let score = 0;

        let snake = {
            x: 160,
            y: 160,
            dx: grid,
            dy: 0,
            cells: [],
            maxCells: 4
        };

        let apple = { x: 320, y: 320 };

        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min)) + min;
        }

        function gameLoop() {
            requestAnimationFrame(gameLoop);

            if (++count < 6) { return; }
            count = 0;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            snake.x += snake.dx;
            snake.y += snake.dy;

            if (snake.x < 0) snake.x = canvas.width - grid;
            else if (snake.x >= canvas.width) snake.x = 0;
            
            if (snake.y < 0) snake.y = canvas.height - grid;
            else if (snake.y >= canvas.height) snake.y = 0;

            snake.cells.unshift({ x: snake.x, y: snake.y });

            if (snake.cells.length > snake.maxCells) {
                snake.cells.pop();
            }

            // رسم التفاحة (رأس المال/الهدف)
            ctx.fillStyle = '#ff0055';
            ctx.shadowColor = '#ff0055';
            ctx.shadowBlur = 10;
            ctx.fillRect(apple.x, apple.y, grid - 1, grid - 1);

            // رسم الثعبان
            ctx.fillStyle = '#00f2fe';
            ctx.shadowColor = '#00f2fe';
            ctx.shadowBlur = 8;
            snake.cells.forEach(function(cell, index) {
                ctx.fillRect(cell.x, cell.y, grid - 1, grid - 1);

                if (cell.x === apple.x && cell.y === apple.y) {
                    snake.maxCells++;
                    score += 10;
                    document.getElementById('score').innerText = score;
                    apple.x = getRandomInt(0, 20) * grid;
                    apple.y = getRandomInt(0, 20) * grid;
                }

                for (let i = index + 1; i < snake.cells.length; i++) {
                    if (cell.x === snake.cells[i].x && cell.y === snake.cells[i].y) {
                        snake.x = 160;
                        snake.y = 160;
                        snake.cells = [];
                        snake.maxCells = 4;
                        snake.dx = grid;
                        snake.dy = 0;
                        score = 0;
                        document.getElementById('score').innerText = score;
                        apple.x = getRandomInt(0, 20) * grid;
                        apple.y = getRandomInt(0, 20) * grid;
                    }
                }
            });
        }

        document.addEventListener('keydown', function(e) {
            if (e.which === 37 && snake.dx === 0) { snake.dx = -grid; snake.dy = 0; }
            else if (e.which === 38 && snake.dy === 0) { snake.dy = -grid; snake.dx = 0; }
            else if (e.which === 39 && snake.dx === 0) { snake.dx = grid; snake.dy = 0; }
            else if (e.which === 40 && snake.dy === 0) { snake.dy = grid; snake.dx = 0; }
        });

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
